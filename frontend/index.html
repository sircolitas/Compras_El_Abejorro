<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos MVP</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; padding: 20px; }
        .btn { background-color: #004080; color: white; padding: 15px 20px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; width: 100%; max-width: 300px; margin: 10px auto; display: block;}
        .btn-success { background-color: #28a745; display: none; }
        .btn-manual { background-color: #ff9800; }
        .btn-cancel { background-color: #6c757d; }
        
        /* Contenedor de múltiples imágenes */
        .preview-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #ccc; }
        
        /* Formulario Manual Oculto */
        #manualForm { display: none; background: white; padding: 20px; border-radius: 10px; max-width: 340px; margin: 20px auto; text-align: left; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        #manualForm label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; }
        #manualForm input[type="text"], #manualForm input[type="number"], #manualForm input[type="date"] { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        
        .radio-group { display: flex; gap: 15px; margin: 5px 0 15px 0; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; margin-top: 0; cursor: pointer; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-weight: normal; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Registro de Comprobantes</h2>

    <!-- Panel Principal -->
    <div id="mainPanel">
        <input type="file" accept="image/*" multiple id="cameraInput" style="display: none;">
        <button class="btn" id="btnTomarFoto" onclick="document.getElementById('cameraInput').click()">📸 FOTO / ARCHIVO</button>
        <button class="btn btn-manual" onclick="mostrarManual()">📝 REGISTRO MANUAL</button>
    </div>

    <!-- Vista Previa de Imágenes -->
    <div class="preview-container" id="previewContainer"></div>
    <button class="btn btn-success" id="btnSubir" onclick="subirImagenes()">☁️ SUBIR IMÁGENES (0)</button>

    <!-- Panel de Ingreso Manual -->
    <div id="manualForm">
        <h3 style="text-align: center; margin-top: 0;">Ingreso Manual</h3>
        
        <label>Fecha del Gasto:</label>
        <input type="date" id="manFecha">

        <label>N° Documento:</label>
        <input type="text" id="manDocumento" placeholder="Ej. F001-000123">

        <label>RUC:</label>
        <input type="number" id="manRuc" placeholder="Ej. 20123456789">
        
        <label>Razón Social:</label>
        <input type="text" id="manRazonSocial" placeholder="Ej. Importaciones SAC">

        <label>Tipo de Comprobante:</label>
        <div class="radio-group">
            <label><input type="radio" name="tipoComprobante" id="manBoleta" value="Boleta" checked> Boleta</label>
            <label><input type="radio" name="tipoComprobante" id="manFactura" value="Factura"> Factura</label>
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="manExonerado"> Es exonerado de IGV
        </label>
        
        <label>Importe Total (S/):</label>
        <input type="number" id="manTotal" step="0.01" placeholder="Ej. 150.50">

        <button class="btn" style="background-color: #28a745; width: 100%; margin: 15px 0 5px 0;" onclick="subirManual()">☁️ GUARDAR GASTO</button>
        <button class="btn btn-cancel" style="width: 100%; margin: 0;" onclick="ocultarManual()">❌ CANCELAR</button>
    </div>

    <script>
        const cameraInput = document.getElementById('cameraInput');
        const previewContainer = document.getElementById('previewContainer');
        const btnSubir = document.getElementById('btnSubir');
        const btnTomarFoto = document.getElementById('btnTomarFoto');
        const mainPanel = document.getElementById('mainPanel');
        const manualForm = document.getElementById('manualForm');
        let archivosSeleccionados = [];

        document.getElementById('manFecha').valueAsDate = new Date();

        cameraInput.addEventListener('change', function(event) {
            archivosSeleccionados = Array.from(event.target.files);
            
            if (archivosSeleccionados.length > 10) {
                alert("Has seleccionado más de 10 archivos. Solo se procesarán los primeros 10.");
                archivosSeleccionados = archivosSeleccionados.slice(0, 10);
            }

            previewContainer.innerHTML = '';
            if (archivosSeleccionados.length > 0) {
                archivosSeleccionados.forEach(file => {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.className = 'preview-img';
                    previewContainer.appendChild(img);
                });
                btnSubir.innerText = `☁️ SUBIR ${archivosSeleccionados.length} IMÁGENES`;
                btnSubir.style.display = 'block';
                btnTomarFoto.innerText = '🔄 CAMBIAR FOTOS';
            }
        });

        async function subirImagenes() {
            btnSubir.innerText = "⏳ Procesando con IA...";
            const formData = new FormData();
            archivosSeleccionados.forEach(file => { formData.append("files", file); });

            try {
                const response = await fetch("https://compras-el-abejorro.onrender.com/upload_multiple", {
                    method: "POST",
                    body: formData
                });
                
                if (response.ok) {
                    alert("¡Listo! Comprobantes procesados."); 
                    window.location.reload(); 
                } else {
                    const errorDetallado = await response.text();
                    alert("Error IA: " + errorDetallado);
                    btnSubir.innerText = `☁️ SUBIR ${archivosSeleccionados.length} IMÁGENES`; 
                }
            } catch (error) {
                alert("Error de conexión con el servidor.");
                btnSubir.innerText = `☁️ SUBIR ${archivosSeleccionados.length} IMÁGENES`;
            }
        }

        function mostrarManual() {
            mainPanel.style.display = 'none';
            previewContainer.style.display = 'none';
            btnSubir.style.display = 'none';
            manualForm.style.display = 'block';
        }

        function ocultarManual() {
            manualForm.style.display = 'none';
            mainPanel.style.display = 'block';
            archivosSeleccionados = [];
            previewContainer.innerHTML = '';
            btnTomarFoto.innerText = '📸 FOTO / ARCHIVO';
        }

        async function subirManual() {
            const fecha = document.getElementById('manFecha').value;
            const documento = document.getElementById('manDocumento').value;
            const ruc = document.getElementById('manRuc').value;
            const razonSocial = document.getElementById('manRazonSocial').value;
            const totalInput = document.getElementById('manTotal').value;
            
            const esFactura = document.getElementById('manFactura').checked;
            const esExonerado = document.getElementById('manExonerado').checked;

            if(!totalInput || !razonSocial || !documento || !ruc) {
                alert("Por favor completa todos los campos del comprobante.");
                return;
            }

            const total = parseFloat(totalInput);
            let valorVenta = total;
            let igv = 0.00;

            // Lógica contable de impuestos
            if (esFactura && !esExonerado) {
                valorVenta = total / 1.18;
                igv = total - valorVenta;
            }

            // Redondeo a 2 decimales para la base de datos
            valorVenta = parseFloat(valorVenta.toFixed(2));
            igv = parseFloat(igv.toFixed(2));

            const data = { 
                fecha: fecha, 
                numero_documento: documento,
                ruc: ruc,
                razon_social: razonSocial,
                tipo_comprobante: esFactura ? "Factura" : "Boleta",
                exonerado_igv: esExonerado,
                valor_venta: valorVenta,
                igv: igv,
                total: total 
            };

            try {
                const response = await fetch("https://compras-el-abejorro.onrender.com/upload_manual", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("¡Gasto manual guardado exitosamente!");
                    window.location.reload();
                } else {
                    alert("Error al guardar en Supabase.");
                }
            } catch (error) {
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
